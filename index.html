<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFEF7">
<meta name="description" content="免费的力量训练与饮食计划：三分化训练、碳水循环、食物库搜索、运动专项">
<title>B1nHYu训练手册</title>
<style>
/* Layout: phone app. Large page titles, a floating pill tab bar, bottom sheets for adding things, pastel sticker cards on a nearly-white butter ground. */
:root{
  --bg:#FFFEF7; --dot:#FFF9E0; --surface:#FFFFFF; --ink:#5B3F2A; --muted:#8F7458; --line:#5B3F2A; --shadow:#5B3F2A; --soft:#F0E6D2;
  --pink:#FFB8CA; --mint:#B5EBD9; --butter:#FFEDB5; --sky:#BFE1FF; --peach:#FFD2B3; --lilac:#E0D4FF;
  --pink-soft:#FFF1F5; --mint-soft:#F0FAF6; --butter-soft:#FFFBE8; --sky-soft:#F2F8FF; --peach-soft:#FFF5EC; --lilac-soft:#F9F6FF;
  --on:#5B3F2A; --good:#1E9E78; --warn:#D9532F;
  --display:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  --num:"Fredoka","Noto Sans SC","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  --body:"Noto Sans SC",system-ui,-apple-system,"Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#2B2310; --dot:#3A3016; --surface:#3A3018; --ink:#FFF3CF; --muted:#CDB98A; --line:#F3D98B; --shadow:#120E05; --soft:#4A3E1E;
  --pink-soft:#58303C; --mint-soft:#1F4A3E; --butter-soft:#5A4A18; --sky-soft:#243F5E; --peach-soft:#5A3A26; --lilac-soft:#40356A;
  --good:#5BDDB0; --warn:#FF8C6A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2B2310; --dot:#3A3016; --surface:#3A3018; --ink:#FFF3CF; --muted:#CDB98A; --line:#F3D98B; --shadow:#120E05; --soft:#4A3E1E;
  --pink-soft:#58303C; --mint-soft:#1F4A3E; --butter-soft:#5A4A18; --sky-soft:#243F5E; --peach-soft:#5A3A26; --lilac-soft:#40356A;
  --good:#5BDDB0; --warn:#FF8C6A; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html.lock{overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;margin:0;padding:0;
  background-image:radial-gradient(var(--dot) 2px,transparent 2px);background-size:26px 26px}
#app{max-width:520px;margin-inline:auto;padding:0 16px;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font-family:var(--body);font-size:16px;color:var(--ink)}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;padding-top:max(18px,env(safe-area-inset-top,0px));margin-bottom:14px;gap:10px}
.hdr .sub{font-size:13px;color:var(--muted)}
.hdr h1{font-family:var(--display);font-weight:400;font-size:36px;line-height:1.1}
.hdr .acts{display:flex;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 var(--shadow);padding:0}
.iconbtn svg{width:22px;height:22px}
.pillbtn{height:44px;padding:0 16px;border-radius:99px;border:2.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;box-shadow:2px 2px 0 var(--shadow);display:inline-flex;align-items:center;gap:6px}
.card{background:var(--surface);border:2.5px solid var(--line);border-radius:24px;padding:16px;box-shadow:3px 3px 0 var(--shadow);margin-bottom:16px;position:relative}
.card.soft{box-shadow:none;background:var(--butter-soft)}
.card h3{font-family:var(--display);font-weight:400;font-size:20px;margin-bottom:8px}
.card .lab{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
.sec{font-family:var(--display);font-size:20px;margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec .more{font-family:var(--body);font-size:13px;color:var(--muted);border:0;background:none;padding:0}
.btn{background:var(--pink);color:var(--on);border:2.5px solid var(--line);border-radius:99px;font-weight:700;font-size:15px;padding:0 20px;height:46px;box-shadow:2px 2px 0 var(--shadow);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--shadow)}
.btn.ghost{background:var(--surface);font-weight:500}
.btn.mint{background:var(--mint)} .btn.sky{background:var(--sky)} .btn.butter{background:var(--butter)}
.btn.block{width:100%}
.btn.sm{height:34px;padding:0 14px;font-size:13px}
.btn.danger{background:var(--surface);color:var(--warn)}
.chip{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:99px;border:2.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"],.chip.on{background:var(--lilac);font-weight:700;box-shadow:2px 2px 0 var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin-inline:-2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.seg{display:flex;gap:4px;background:var(--soft);border:2.5px solid var(--line);border-radius:99px;padding:3px}
.seg button{flex:1;height:36px;border:0;border-radius:99px;background:transparent;font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--butter);font-weight:700;box-shadow:inset 0 0 0 2px var(--line)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field>label,.field>.lab{font-size:13px;color:var(--muted);font-weight:700}
.field input,.field select,.field textarea,.inp{width:100%;height:46px;border-radius:16px;border:2.5px solid var(--line);background:var(--bg);padding:0 14px;font-weight:500}
.field textarea{height:120px;padding:10px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--muted)}
.alert{background:var(--butter-soft);border:2.5px solid var(--line);border-radius:16px;padding:10px 14px;font-size:14px;margin-bottom:10px}
.alert b{color:var(--warn)}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-size:14px}

/* ring + bars */
.ringwrap{display:flex;gap:14px;align-items:center}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .mid b{font-family:var(--num);font-size:34px;line-height:1}
.ring .mid span{font-size:12px;color:var(--muted)}
.bars{display:grid;gap:10px;flex:1;min-width:0}
.bar{display:grid;gap:3px}
.bar .t{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.bar .t b{font-family:var(--num);color:var(--ink);font-weight:600}
.bar .track{height:12px;border:2px solid var(--line);border-radius:99px;background:var(--surface);overflow:hidden}
.bar .fill{height:100%;border-right:2px solid var(--line);background:var(--pink)}
.bar.c .fill{background:var(--mint)} .bar.f .fill{background:var(--butter)} .bar.k .fill{background:var(--sky)}
.bar .fill.over{background:var(--warn)}

/* tab bar */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 14px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
#tabbar .in{pointer-events:auto;width:100%;max-width:492px;display:flex;background:var(--surface);border:2.5px solid var(--line);border-radius:30px;padding:6px;box-shadow:3px 3px 0 var(--shadow)}
#tabbar button{flex:1;border:0;background:transparent;border-radius:24px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted)}
#tabbar button svg{width:24px;height:24px}
#tabbar button[aria-selected="true"]{background:var(--pink);color:var(--on);font-weight:700}
#tabbar button:nth-child(2)[aria-selected="true"]{background:var(--mint)} #tabbar button:nth-child(3)[aria-selected="true"]{background:var(--sky)}
#tabbar button:nth-child(4)[aria-selected="true"]{background:var(--butter)} #tabbar button:nth-child(5)[aria-selected="true"]{background:var(--lilac)}

/* sheets */
.sheetbg{position:fixed;inset:0;z-index:40;background:rgba(60,40,20,.38);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92dvh;max-height:92vh;background:var(--bg);border:2.5px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet.full{max-height:100dvh;height:100dvh;border-radius:0;border:0}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);opacity:.35;margin:8px auto 0;flex:none}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 6px;gap:10px;flex:none}
.sheet .sh h3{font-family:var(--display);font-weight:400;font-size:22px}
.sheet .sb{overflow-y:auto;padding:6px 16px calc(24px + env(safe-area-inset-bottom,0px));flex:1;-webkit-overflow-scrolling:touch}
.sheet .sf{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:2.5px solid var(--line);background:var(--surface);flex:none;display:flex;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:700;max-width:90vw}

/* lists */
.item{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:2px dotted var(--soft);min-height:56px}
.item:last-child{border-bottom:0}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .nm span{font-size:12px;color:var(--muted)}
.item .r{font-family:var(--num);font-weight:600;color:var(--good);white-space:nowrap}
.star{width:36px;height:36px;border:0;background:none;color:var(--muted);padding:0;font-size:20px}
.star.on{color:#E0A100}
.plus{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--line);background:var(--butter);font-size:22px;font-weight:700;line-height:1;padding:0;display:inline-flex;align-items:center;justify-content:center}
.meal{margin-bottom:14px}
.meal .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.meal .mh b{font-family:var(--display);font-weight:400;font-size:20px}
.meal .mh span{font-size:12px;color:var(--muted)}
.reco{background:var(--butter-soft);border:2px dashed var(--line);border-radius:16px;padding:10px 12px;margin-top:8px;font-size:13px}
.reco b{font-weight:700}
.badge{display:inline-block;font-size:11px;font-weight:700;border:2px solid var(--line);border-radius:99px;padding:0 9px;margin-left:6px;line-height:1.5;color:var(--on);background:var(--mint);vertical-align:2px}
.badge.b2{background:var(--butter)} .badge.b1{background:var(--mint)} .badge.out{background:var(--peach)}
.datestrip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin-inline:-2px;scrollbar-width:none}
.datestrip::-webkit-scrollbar{display:none}
.dchip{flex:none;width:46px;height:68px;border-radius:20px;border:2.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);padding:0}
.dchip b{font-family:var(--num);font-size:18px;color:var(--ink)}
.dchip i{width:6px;height:6px;border-radius:50%;background:var(--mint);opacity:0}
.dchip.has i{opacity:1}
.dchip[aria-pressed="true"]{background:var(--butter);box-shadow:2px 2px 0 var(--shadow)}

/* training */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.week .wd{border:2.5px solid var(--line);border-radius:16px;padding:6px 0;text-align:center;background:var(--surface);font-size:11px;color:var(--muted)}
.week .wd b{display:block;font-family:var(--display);font-weight:400;font-size:18px;color:var(--ink)}
.week .wd.c0{background:var(--pink)} .week .wd.c1{background:var(--sky)} .week .wd.c2{background:var(--mint)} .week .wd.c3{background:var(--butter-soft)}
.week .wd.now{outline:3px solid var(--ink);outline-offset:2px}
.next .tag{display:inline-block;font-size:12px;color:var(--muted);font-weight:700}
.next h3{font-size:24px;margin-block:2px 6px}
.next .list{font-size:13px;color:var(--muted);margin-bottom:12px}
.tpl{display:flex;align-items:center;gap:12px;padding:12px;border:2.5px solid var(--line);border-radius:20px;background:var(--surface);margin-bottom:10px}
.tpl .ico{width:48px;height:48px;border-radius:16px;border:2.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:20px;flex:none}
.tpl .nm{flex:1;min-width:0}
.tpl .nm b{display:block}
.tpl .nm span{font-size:12px;color:var(--muted)}
.c0bg{background:var(--pink)} .c1bg{background:var(--sky)} .c2bg{background:var(--mint)} .c3bg{background:var(--butter)}
.hist .item .d{width:52px;font-size:12px;color:var(--muted);flex:none;line-height:1.2}
.exc{margin-bottom:14px}
.exc .eh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.exc .eh b{font-size:16px}
.exc .eh small{display:block;color:var(--muted);font-size:12px}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 46px;gap:8px;align-items:center;margin-bottom:8px}
.setrow.hd{font-size:11px;color:var(--muted);margin-bottom:4px;text-align:center}
.setrow .i{font-family:var(--num);font-weight:600;text-align:center}
.setrow input{height:46px;width:100%;border:2.5px solid var(--line);border-radius:16px;background:var(--bg);text-align:center;font-family:var(--num);font-weight:600;font-size:18px;padding:0}
.setrow.done input{background:var(--mint-soft)}
.checkbtn{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--line);background:var(--surface);font-size:20px;line-height:1;padding:0;color:var(--muted)}
.setrow.done .checkbtn{background:var(--mint);color:var(--on)}
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);border-radius:99px;padding:8px 8px 8px 18px;display:flex;gap:10px;align-items:center;font-weight:700}
.rest button{border:0;border-radius:99px;background:var(--bg);color:var(--ink);height:30px;padding:0 12px;font-size:12px;font-weight:700}
.lib{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2.5px solid var(--line);border-radius:18px;margin-bottom:8px;background:var(--surface)}
.lib.r2{background:var(--butter-soft)} .lib.r1{background:var(--mint-soft)}
.lib .nm{flex:1;min-width:0}
.lib .nm b{display:block;font-size:14px}
.lib .nm span{font-size:12px;color:var(--muted)}
.cue{font-size:13px;color:var(--muted);margin-top:6px}

/* progress */
.chartbox svg{width:100%;height:auto;display:block}
.chartbox text{fill:var(--muted);font-family:var(--body);font-size:10px}
.hbar{display:grid;grid-template-columns:44px 1fr 56px;gap:8px;align-items:center;margin-bottom:8px;font-size:13px}
.hbar .tr{height:14px;border:2px solid var(--line);border-radius:99px;background:var(--surface);position:relative;overflow:hidden}
.hbar .band{position:absolute;top:0;bottom:0;background:var(--mint-soft)}
.hbar .f{position:absolute;top:0;bottom:0;left:0;background:var(--pink);border-right:2px solid var(--line)}
.hbar .f.ok{background:var(--mint)}
.pr{display:grid;grid-template-columns:1fr 70px 50px;gap:6px;font-size:13px;padding:7px 0;border-bottom:2px dotted var(--soft);align-items:center}
.pr .n{font-family:var(--num);text-align:right;font-weight:600}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:2px dotted var(--soft);text-align:left;font-size:13px}
th{color:var(--muted)}
td.n,th.n{text-align:right;font-family:var(--num)}
.coachbox{display:flex;gap:12px}
.coachbox .mascot{width:56px;flex:none}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{border:2.5px solid var(--line);border-radius:18px;padding:8px 4px;text-align:center;background:var(--surface)}
.tile b{display:block;font-family:var(--num);font-size:20px;line-height:1.1}
.tile span{font-size:11px;color:var(--muted)}
details{border-top:2px dashed var(--soft);padding-block:10px}
details>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"＋";color:var(--muted)}
details[open]>summary::after{content:"－"}
ul.tight{margin:6px 0 0;padding-left:20px}
ul.tight li{margin-bottom:4px}
.mascot{width:90px;height:auto}
.onb{text-align:center;padding:10px 0}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.dchip{transition:transform .08s}
.sheet.anim{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.4}}}

.week .wd{font-family:var(--body);cursor:pointer;line-height:1.2;padding:6px 0 4px;color:var(--muted)}
.week .wd small{display:block;font-size:10px;color:var(--muted)}
.week .wd.done small::after{content:" ✓";color:var(--good);font-weight:700}
.weeknav{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:14px;font-weight:700}
.weeknav span{flex:1;text-align:center}
.sports{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sport{border:2.5px solid var(--line);border-radius:22px;box-shadow:3px 3px 0 var(--shadow);padding:14px 12px;text-align:left;color:var(--on);display:flex;flex-direction:column;gap:2px;min-height:112px}
.sport .em{font-size:34px;line-height:1.1}
.sport b{font-family:var(--display);font-weight:400;font-size:20px}
.sport small{font-size:12px;opacity:.8}
.sport:active{transform:translate(2px,2px);box-shadow:none}

/* ---------- 饮食：红绿灯 / 餐次 / 分析 ---------- */
.lt{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex:none}
.lt.g{background:#6FD3A8}.lt.y{background:#FFD25E}.lt.r{background:#FF8C7A}
.item .r2{text-align:right;font-family:var(--num);line-height:1.1}
.item .r2 b{display:block;font-size:17px}.item .r2 span{font-size:11px;color:var(--muted)}
.meal .mh small{margin-left:8px;font-size:11px;color:var(--muted)}
.meal .mh em{font-style:normal;font-family:var(--num);font-weight:700;font-size:15px}
.meal .mh em.over{color:var(--warn)}
.mbar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0 4px}
.mbar i{display:block;height:100%;background:var(--mint);border-radius:99px}.mbar i.over{background:var(--warn)}
.an{display:grid;grid-template-columns:52px 1fr 40px;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.an .track{position:relative;height:12px;border:2px solid var(--line);border-radius:99px;background:var(--surface);overflow:visible}
.an .track i{display:block;height:100%;background:var(--butter);border-radius:99px}
.an .track i.c{background:var(--butter)}.an .track i.p{background:var(--pink)}.an .track i.f{background:var(--sky)}
.an .track u{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--on);border-radius:2px}
.an b{font-family:var(--num);text-align:right}
.ltbar{display:flex;height:14px;border:2px solid var(--line);border-radius:99px;overflow:hidden;margin:6px 0}
.ltbar i.g{background:#6FD3A8}.ltbar i.y{background:#FFD25E}.ltbar i.r{background:#FF8C7A}
.ltag{display:inline-block;padding:2px 10px;border:2px solid var(--line);border-radius:99px;font-size:12px;font-weight:700;margin-left:6px}
.ltag.g{background:#CFF3E3}.ltag.y{background:#FFF0B8}.ltag.r{background:#FFD3CB}
.shbar{display:flex;height:22px;border:2.5px solid var(--line);border-radius:99px;overflow:hidden;font-size:11px;font-weight:700;margin:6px 0}

/* ---------- calculation ---------- */
function calc(){
  const male=P.sex==="m", bmi=P.w/((P.h/100)**2);
  const bfKnown=P.bf>0;
  const bf=bfKnown?P.bf:clamp(1.2*bmi+.23*P.age-10.8*(male?1:0)-5.4,5,55);
  const lbm=P.w*(1-bf/100);
  const bmr=10*P.w+6.25*P.h-5*P.age+(male?5:-161);
  const lifeF={sed:1.2,light:1.35,act:1.5}[P.life];
  const td=P.sched==="cycle"?5.25:+P.sched;
  const tdee=bmr*lifeF+td*250/7;
  const flags=[];
  const hi=male?25:33, mid=male?15:23;
  let pct;
  if(P.goal==="cut") pct=bf>=hi?-.22:bf>=mid?-.18:-.12;
  else if(P.goal==="recomp") pct=(P.exp==="novice"||bf>=hi)?-.12:-.05;
  else if(P.goal==="bulk") pct=P.exp==="novice"?.08:.05;
  else pct=0;
  if(pct<0&&P.age<18){pct=0;flags.push(["未成年","18岁以下不建议制造热量缺口，已按维持热量计算。保证吃够、睡够，靠训练和成长改变体型。"])}
  if(pct<0&&P.preg){pct=0;flags.push(["怀孕或哺乳","怀孕或哺乳期不应减脂，已按维持热量显示，仅供参考。饮食请遵医嘱。"])}
  if(pct<0&&bmi<18.5){pct=0;flags.push(["体重偏低","BMI低于18.5，不建议减脂，已按维持热量计算。"])}
  if(pct<0&&bmi>=18.5&&bmi<20.5)flags.push(["提醒","你的BMI已经偏低，减脂的空间不大，建议把目标改为增肌或维持。"]);
  let kcal=tdee*(1+pct);
  if(pct<0&&tdee-kcal>700)kcal=tdee-700;
  const floor=Math.max(male?1500:1200,Math.round(bmr*.9));
  if(kcal<floor){kcal=floor;flags.push(["热量下限","按公式算出的热量低于安全下限，已提高到"+floor+" kcal。不建议吃得更少。"])}
  const thr=male?25:33;
  const ref=bf>thr?lbm/(1-thr/100):P.w;
  const gpk={cut:2,recomp:2,bulk:1.8,maint:1.6}[P.goal];
  let protein=Math.round(gpk*ref);
  protein=Math.min(protein,Math.round(.4*kcal/4));
  let fat=Math.round(Math.max(.8*ref,(male?.22:.27)*kcal/9));
  let carb=Math.round((kcal-protein*4-fat*9)/4);
  if(carb<100){carb=100;kcal=protein*4+fat*9+carb*4}
  kcal=Math.round(kcal/10)*10;
  const restCarb=Math.round(carb*.85);
  const restKcal=Math.round((protein*4+fat*9+restCarb*4)/10)*10;
  const rate=(kcal-tdee)*7/7700;
  return {male,bmi,bf,bfKnown,lbm,fatMass:P.w-lbm,bmr,tdee,kcal,protein,fat,carb,restCarb,restKcal,rate,flags,
    water:Math.round(P.w*35/100)/10,fibre:male?30:25,pct};
}

function cardioRec(id){

/* 自己做的一餐：按这一餐的目标营养素算出食物克数 */
function cookMeal(kind,t){
  const cf=FOODS[P.carb], pk=(P.veg&&FOODS[P.prot].meat)?"tofu":P.prot, pf=FOODS[pk];
  const vf=FOODS[P.veg2], ff=FOODS[P.fruit], bcf=FOODS[P.bfcarb], items=[];
  const fatFill=(rem,list)=>{const oil=clamp(rem,0,12);if(oil>=1)list.push(["oil",Math.round(oil)]);const r2=rem-oil;
    if(r2>2){const n=clamp(r2/.5,0,40);list.push(["nuts",r5(n)||5])}};
  if(kind==="bf"){
    const eggs=clamp(Math.round(t.p*.45/6.5),1,3);
    items.push(["egg",eggs*50]);
    const gC=Math.max(0,(t.c-ff.c-eggs*.5)/(bcf.c/100));
    const pLeft=t.p-eggs*6.5-bcf.p*gC/100;
    const yog=clamp(pLeft/.10,0,300), whey=pLeft-yog*.10>3?(pLeft-yog*.10)/.8:0;
    items.push([P.bfcarb,r5(gC)],[P.fruit,100]);
    if(yog>=20)items.push(["yogurt",r5(yog)]);
    if(whey>=8)items.push(["whey",r5(whey)]);
    fatFill(t.f-mk(items).f,items);
  }else if(kind==="main"){
    const vg=250;let gC=0,gP=0;
    for(let n=0;n<5;n++){gP=Math.max(0,(t.p-cf.p*gC/100-vf.p*vg/100)/pf.p*100);gC=Math.max(0,(t.c-vf.c*vg/100-pf.c*gP/100)/cf.c*100)}
    items.push([pk,r5(gP)],[P.carb,r5(gC)],[P.veg2,vg]);
    fatFill(t.f-mk(items).f,items);
  }else if(kind==="snack"){
    const w=clamp(t.p/.8,10,45),fr=Math.max(0,(t.c-FOODS.whey.c*w/100)/(ff.c/100));
    items.push(["whey",r5(w)],[P.fruit,r5(fr)]);
  }else{
    const yg=clamp(t.p/.10,0,250);items.push(["yogurt",r5(yg)]);
    const fr=(t.c-FOODS.yogurt.c*yg/100)/(ff.c/100);if(fr>=40)items.push([P.fruit,r5(fr)]);
    const n=clamp((t.f-mk(items).f)/.5,0,40);if(n>=5)items.push(["nuts",r5(n)]);
  }
  return items;
}
/* 外食的一餐：从茶餐室套餐里挑一个，按这一餐的热量缩放 */
function outMeal(kind,t,pick,used){
  const tk=t.p*4+t.c*4+t.f*9, key=kind==="bf"?"bf":kind==="main"?"main":"snack";
  const pool=SETS[key].filter(setOK);
  if(!pool.length)return null;
  let best=null;
  if(pick){const s=pool.find(z=>z.n===pick);if(s){const m=mk(s.items);best={s,sc:clamp(tk/m.k,.55,1.4)}}}
  if(!best)pool.forEach(s=>{const m=mk(s.items),sc=clamp(tk/m.k,.55,1.4),
    pr=Math.abs(m.p*sc/Math.max(t.p,1)-1)*.6+Math.abs(sc-1)*.5+Math.abs(m.f*sc/Math.max(t.f,8)-1)*.2+(used.has(s.n)?5:0);
    if(!best||pr<best.pr)best={s,sc,pr}});
  used.add(best.s.n);
  const items=best.s.items.map(([k,g])=>[k,scaleG(k,g,best.sc)]);
  const pLeft=t.p-mk(items).p;
  if(pLeft>8&&key!=="snack"){const pk=P.veg?"tofu":"poachedchicken",pf=FOODS[pk];items.push([pk,r5(clamp(pLeft/(pf.p/100),0,150))])}
  return {items,note:best.s.d,setName:best.s.n};
}

function buildDay(T,modes,picks){
  const sh=SHARE[+P.meals]||SHARE[5], n=sh.kinds.length, meals=new Array(n), used=new Set();
  const rem={p:T.p,c:T.c,f:T.f};
  sh.kinds.forEach((kind,i)=>{
    if(modes[i]!=="out")return;
    const t={p:T.p*sh.P[i],c:T.c*sh.C[i],f:T.f*sh.F[i]}, o=outMeal(kind,t,picks&&picks[i],used);
    if(!o){modes[i]="cook";return}
    meals[i]={name:sh.names[i],mode:"out",items:o.items,note:o.note,setName:o.setName};
    const tt=mk(o.items);rem.p-=tt.p;rem.c-=tt.c;rem.f-=tt.f;
  });
  const idx=sh.kinds.map((_,i)=>i).filter(i=>!meals[i]);
  const sum=a=>idx.reduce((x,i)=>x+a[i],0)||1, sP=sum(sh.P), sC=sum(sh.C), sF=sum(sh.F);
  idx.forEach(i=>{
    const t={p:Math.max(0,rem.p)*sh.P[i]/sP,c:Math.max(0,rem.c)*sh.C[i]/sC,f:Math.max(0,rem.f)*sh.F[i]/sF};
    meals[i]={name:sh.names[i],mode:"cook",items:cookMeal(sh.kinds[i],t)};
  });
  return meals;
}

function sportWeek(freq,season){
  const seq=season==="in"?(freq>=2?["A","B"]:["A"]):(freq>=4?["A","B","C","A"]:freq===3?["A","B","C"]:["A","B"]);
  const days=seq.length===1?[3]:seq.length===2?[2,5]:seq.length===3?[1,3,5]:[1,2,4,5];
  return days.map((d,i)=>({d,s:seq[i]}));
}
const sportItems=(sp,letter,season)=>{
  const mult=season==="in"?.6:1;
  return sp.S[letter].items.map(t=>{const [id,sets,...rest]=t.split(":");return {id,sets:Math.max(1,Math.round(+sets*mult)),reps:rest.join(":")}});
};

const unitOf=k=>{const f=FOODS[k];return f.cat==="drink"?"ml":"g"};
const foodKcal=(k,g)=>Math.round(FOODS[k].k*g/100);
const foodP=(k,g)=>Math.round(FOODS[k].p*g/100*10)/10;
function foodMatch(f,ql){return (f.n+" "+(f.al||"")).toLowerCase().includes(ql)}
function searchFoods(q,cat,mode,sort){
  const ql=q.trim().toLowerCase();
  let keys;
  if(mode==="recent")keys=LS.get("recent",[]).map(x=>x[0]);
  else if(mode==="fav")keys=favs();
  else keys=Object.keys(FOODS);
  keys=keys.filter(k=>FOODS[k]);
  if(cat&&cat!=="全部")keys=keys.filter(k=>FOODS[k].cat===cat);
  if(ql){
    keys=keys.filter(k=>foodMatch(FOODS[k],ql));
    keys.sort((a,b)=>{const A=FOODS[a].n.toLowerCase().startsWith(ql)?0:FOODS[a].n.toLowerCase().includes(ql)?1:2,B=FOODS[b].n.toLowerCase().startsWith(ql)?0:FOODS[b].n.toLowerCase().includes(ql)?1:2;return A-B});
  }else if(mode==="all"){keys.sort((a,b)=>CATORDER.indexOf(FOODS[a].cat)-CATORDER.indexOf(FOODS[b].cat))}
  if(sort==="kl")keys.sort((a,b)=>FOODS[a].k-FOODS[b].k);
  else if(sort==="ph")keys.sort((a,b)=>FOODS[b].p/Math.max(FOODS[b].k,1)-FOODS[a].p/Math.max(FOODS[a].k,1));
  return keys;
}
function addCustomFood(n,k,p,c,f,g){
  const cf=LS.get("cfoods",{});

  cf[id]=obj;LS.set("cfoods",cf);FOODS[id]=obj;return id;
}

/* ---------- 教练：今日小结（本地规则） ---------- */
function nextEmptySlot(d){for(const m of slotNames())if(!mealItems(d,m).length)return m;return "加餐"}
function coachToday(d){
  const t=targetFor(d),tot=dayTotals(d),T=t.T,tK=t.tK;
  const rem={k:Math.round(tK-tot.k),p:Math.round(T.p-tot.p),c:Math.round(T.c-tot.c),f:Math.round(T.f-tot.f)};
  const slot=nextEmptySlot(d), {plan}=planFor(d), rc=recoItems(plan,slot);
  let title,body;
  if(tot.k<50){
    title="今天还没记录饮食";
    body=rc.has?`先从${slot}开始。推荐：${rc.items.slice(0,5).map(([k,g])=>FOODS[k].n.replace(/（.*?）/g,"")+" "+g+unitOf(k)).join("、")}，点一下就能记录。`:`先从${slot}开始，点“＋”记录第一口。`;
  }else if(rem.k<-Math.max(120,tK*.06)){
    title=`热量已经超了 ${-rem.k} kcal`;
    body="今天剩下的时间选清淡一点：蔬菜、瘦肉、蛋白，少油少糖。一天超一点没关系，别用明天少吃来补。";
  }else if(rem.p>15){
    title=`今天蛋白质还差 ${rem.p} g`;
    const need=Math.min(rem.p,45), light=rem.k<250;
    const pk=light?"eggw":(P.veg?"tofu":"chicken"), pf=FOODS[pk], g=r5(need/(pf.p/100));
    const kc=Math.round(pf.k*g/100);
    body=`建议：${slot}加 ${g}g ${pf.n.replace(/（.*?）/g,"")}（≈${Math.round(pf.p*g/100)}g 蛋白，${kc} kcal）${!light&&rem.p>need+8?"，再来一杯希腊酸奶（≈10g 蛋白）":""}。热量还剩 ${Math.max(0,rem.k)} kcal。`;
  }else if(rem.k>350&&tot.k>400){
    title="吃得有点少";
    body=`热量还剩 ${rem.k} kcal，碳水还差 ${Math.max(0,rem.c)}g。训练前后可以补一份主食，比如 ${r5(Math.max(0,rem.c)/.26)}g 米饭。`;
  }else{
    title="今天的营养很到位";
    body=`热量还剩 ${Math.max(0,rem.k)} kcal，蛋白质、碳水、脂肪都接近目标，保持就好。`;
  }
  return {title,body,rem,tot,t};
}

const sessions=()=>LS.keys().filter(k=>k.startsWith("ses:")).map(k=>LS.get(k,null)).filter(Boolean).sort((a,b)=>a.date<b.date?1:-1);
const parseReps=s=>{const m=String(s).match(/\d+/);return m?clamp(+m[0],1,30):10};
function lastSets(id,before){
  for(const s of sessions()){if(!s.done||(before&&s.date>=before))continue;const e=s.ex.find(x=>x.id===id);if(e){const dn=e.sets.filter(z=>z.done&&z.kg!==""&&z.kg!=null);if(dn.length)return dn}}
  return [];
}
function newSession(day,date){
  date=date||today;
  const sel=getSel(day),wk=weekOf(date);
  const ex=sel.map((it,i)=>{
    const e=EX[it.id],n=it.sets||setsFor(i,wk),last=lastSets(it.id,date),r0=parseReps(it.reps||e.r),legacy=LS.get("kg:"+it.id,"");
    return {id:it.id,target:it.reps||e.r,sets:Array.from({length:n},(_,k)=>{const l=last[k]||last[last.length-1];return {kg:l?l.kg:legacy,reps:l?l.reps:r0,done:false}})};
  });
  return {day,date,t0:Date.now(),t1:null,done:false,ex};
}
const e1rm=(kg,reps)=>kg>0&&reps>0?Math.round(kg*(1+reps/30)):0;
function sesStats(s){
  let sets=0,vol=0;s.ex.forEach(e=>e.sets.forEach(z=>{if(z.done){sets++;vol+=(+z.kg||0)*(+z.reps||0)}}));
  return {sets,vol:Math.round(vol/100)/10,min:s.retro?null:Math.max(1,Math.round(((s.t1||Date.now())-s.t0)/60000))};
}
function allPRs(){
  const best={};
  sessions().filter(s=>s.done).slice().reverse().forEach(s=>s.ex.forEach(e=>e.sets.forEach(z=>{
    if(!z.done)return;const v=e1rm(+z.kg,+z.reps),rec=best[e.id]||(best[e.id]={e1:0,kg:0,reps:0,date:"",hist:[]});
    if(v>rec.e1){rec.e1=v;rec.kg=+z.kg;rec.reps=+z.reps;rec.date=s.date}
    rec.hist.push({d:s.date,v});
  })));
  return best;
}
const MUSCLE={"胸":"胸","肩":"肩","后束":"肩","背":"背","手臂":"手臂","腿":"腿","臀":"臀","核心":"核心"};
const MUSCLES=["胸","背","肩","手臂","腿","臀","核心"];
function weekRange(offset){const d=new Date(today+"T00:00:00"),wd=(d.getDay()+6)%7;const s=addDays(today,-wd+offset*7);return [s,addDays(s,6)]}
function weekSets(offset){
  const [a,b]=weekRange(offset),out={};MUSCLES.forEach(m=>out[m]=0);
  sessions().filter(s=>s.done&&s.date>=a&&s.date<=b).forEach(s=>s.ex.forEach(e=>{const g=MUSCLE[EX[e.id]&&EX[e.id].g];if(!g)return;e.sets.forEach(z=>{if(z.done)out[g]++})}));
  return out;
}

/* ---------- 进度 ---------- */
function chartSVG(points,avgPts,unit){
  if(points.length<2)return `<div class="empty">记录至少 2 次后显示曲线</div>`;
  const W=340,H=170,L=34,Rr=8,T=10,B=22;
  const vals=points.map(p=>p.v),lo=Math.floor(Math.min(...vals)-.5),hi=Math.ceil(Math.max(...vals)+.5);
  const x0=dayNum(points[0].d),x1=Math.max(dayNum(points[points.length-1].d),x0+1);
  const X=d=>L+(dayNum(d)-x0)/(x1-x0)*(W-L-Rr),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const step=Math.max(.5,(hi-lo)/4),ticks=[];for(let v=lo;v<=hi+.01;v+=step)ticks.push(v);
  const avg=avgPts.length>1?`<polyline points="${avgPts.map(p=>X(p.d).toFixed(1)+","+Y(p.v).toFixed(1)).join(" ")}" fill="none" stroke="var(--good)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:"";
  return `<svg viewBox="0 0 ${W} ${H}">${ticks.map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--soft)"/><text x="${L-5}" y="${Y(v)+3}" text-anchor="end">${(+v.toFixed(1))}</text>`).join("")}${points.map(p=>`<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="3.2" fill="var(--pink)" stroke="var(--line)" stroke-width="1.2"/>`).join("")}${avg}<text x="${L}" y="${H-5}">${points[0].d.slice(5)}</text><text x="${W-Rr}" y="${H-5}" text-anchor="end">${points[points.length-1].d.slice(5)}</text></svg>`;
}
function movingAvg(points,n){return points.map(p=>{const w=points.filter(q=>q.d<=p.d&&dayNum(q.d)>dayNum(p.d)-n);return {d:p.d,v:w.reduce((a,b)=>a+b.v,0)/w.length}})}
function seriesData(){
  let src=S.progTab==="weight"?ws.map(x=>({d:x.d,v:x.v})):S.progTab==="bf"?ws.filter(x=>x.bf).map(x=>({d:x.d,v:x.bf})):wa.map(x=>({d:x.d,v:x.v}));
  src=src.slice().sort((a,b)=>a.d<b.d?-1:1);
  if(S.range)src=src.filter(x=>dayNum(x.d)>=dayNum(today)-S.range);
  return src;
}
function adaptiveTDEE(){
  const days=[];for(let i=1;i<=21;i++){const d=addDays(today,-i),t=dayTotals(d);if(t.k>600)days.push(t.k)}
  const w=ws.filter(x=>dayNum(x.d)>=dayNum(today)-21).sort((a,b)=>a.d<b.d?-1:1);
  if(days.length<7||w.length<5)return {ok:false,days:days.length,w:w.length};
  const n=w.length,xs=w.map(p=>dayNum(p.d)),mx=xs.reduce((a,b)=>a+b,0)/n,my=w.reduce((a,p)=>a+p.v,0)/n;
  let num=0,den=0;w.forEach((p,i)=>{num+=(xs[i]-mx)*(p.v-my);den+=(xs[i]-mx)**2});
  const slope=den?num/den:0, intake=days.reduce((a,b)=>a+b,0)/days.length, est=intake-slope*7700;
  const wt=clamp(days.length/21,0,1)*.85, blend=Math.round(wt*est+(1-wt)*R.tdee);
  return {ok:true,est:Math.round(est),blend,intake:Math.round(intake),slope:Math.round(slope*70)/10,days:days.length,w:n,wt};
}

  <div class="hint">${(()=>{const low=MUSCLES.filter(m=>sets[m]<10);return Object.values(sets).every(x=>x===0)?"本周还没有完成的训练组。":low.length?low.join("、")+" 低于 10 组。可以每次给这些部位加 2–3 组，或在别的训练日补一个动作。":"各肌群都达到了 10 组以上。"})()}</div></div>

/* ---------- 教练 ---------- */
function weekReview(){
  const [a,b]=weekRange(0),planned=[...Array(7)].filter((_,i)=>dayIndexFor(addDays(a,i))<3&&addDays(a,i)<=today).length;
  const done=sessions().filter(s=>s.done&&s.date>=a&&s.date<=b).length;
  const rows=[];for(let i=0;i<7;i++){const d=addDays(a,i);if(d>today)break;const t=dayTotals(d);if(t.k>300){const tg=targetFor(d);rows.push({k:t.k,p:t.p,tk:tg.tK,tp:tg.T.p})}}
  const avgK=rows.length?rows.reduce((x,r)=>x+r.k,0)/rows.length:0, okP=rows.filter(r=>r.p>=r.tp*.9).length;
  const w1=weightAvg(7),w0=(()=>{const x=ws.filter(p=>p.d<=addDays(today,-7)&&p.d>addDays(today,-14)).map(p=>p.v);return x.length?x.reduce((a,b)=>a+b,0)/x.length:null})();
  const sets=weekSets(0),low=MUSCLES.filter(m=>sets[m]<10);
  const tips=[];
  if(planned&&done<planned)tips.push(`本周计划 ${planned} 次训练，已完成 ${done} 次。`);
  if(rows.length>=3){
    const rate=w1&&w0?(w1-w0)/w0*100:null;
    if(P.goal==="cut"||P.goal==="recomp"){
      if(rate!==null&&rate>-.1)tips.push(`体重这周几乎没降（${rate.toFixed(2)}%）。连续 2 周都这样的话，碳水减 20–30g，或加一次有氧。`);
      else if(rate!==null&&rate<-1)tips.push(`体重降得偏快（${rate.toFixed(2)}%）。碳水加 30g，保护训练强度和肌肉。`);
      else if(rate!==null)tips.push("体重下降速度在合适范围内，保持。");
    }else if(P.goal==="bulk"&&w1&&w0){const rate=(w1-w0)/w0*100;tips.push(rate>.5?"增重偏快，每天减 100–150 kcal。":rate<.05?"体重没怎么涨，每天加 100–200 kcal，主要加碳水。":"增重速度合适。")}
    if(rows.length&&okP<rows.length*.6)tips.push(`蛋白质达标只有 ${okP}/${rows.length} 天，优先每餐补 25–40g 蛋白质。`);
  }else tips.push("饮食记录不足 3 天，记录几天后这里会给出更准的建议。");
  if(done&&low.length)tips.push(`${low.slice(0,4).join("、")}本周低于 10 组，可以每次加 2–3 组。`);
  const cm=weekCardioMin();tips.push(`本周有氧 ${cm} 分钟。`);
  return {planned,done,avgK,okP,n:rows.length,w1,w0,tips};
}

    h+=`<div class="field" style="margin-top:10px"><label for="cyc-preset">日型搭配</label><select id="cyc-preset">${Object.entries(PRESETS).map(([k,p])=>`<option value="${k}" ${c.preset===k?"selected":""}>${p.n}</option>`).join("")}<option value="custom" ${c.preset==="custom"?"selected":""}>自定义</option></select></div>
    <div class="grid2" style="grid-template-columns:repeat(3,1fr)">${["H","M","L"].map(k=>`<div class="field"><label for="cyc-${k}">${TIERN[k]}（倍）</label><input id="cyc-${k}" type="number" step="0.5" min="0.5" max="10" value="${c[k]}"></div>`).join("")}</div>
    <div class="grid2">${DAYS.map(d=>`<div class="field"><label for="cyc-t-${d.k}">${d.name}</label><select id="cyc-t-${d.k}" data-tier="${d.k}">${["H","M","L"].map(t=>`<option value="${t}" ${c.tier[d.k]===t?"selected":""}>${TIERN[t]}</option>`).join("")}</select></div>`).join("")}</div>
    <label style="display:flex;gap:10px;align-items:center;margin-bottom:10px;font-size:13px"><input type="checkbox" id="cyc-cal" ${c.cal?"checked":""} style="width:22px;height:22px;accent-color:var(--pink)"> 按目标热量校准（让周期平均等于 ${R.kcal} kcal）</label>
    <table><thead><tr><th>日型</th><th>档位</th><th class="n">碳水g</th><th class="n">倍数</th><th class="n">kcal</th></tr></thead><tbody>${DAYS.map(d=>`<tr><td>${d.name}</td><td>${TIERN[c.tier[d.k]]}</td><td class="n">${cy.carbs[d.k]}</td><td class="n">${(cy.carbs[d.k]/P.w).toFixed(1)}</td><td class="n">${cy.kc[d.k]}</td></tr>`).join("")}</tbody></table>
    <p class="hint" style="margin-top:6px">一个周期平均约 ${cy.avgK} kcal/天。蛋白质（${R.protein}g）和脂肪（${R.fat}g）不变，只调碳水。</p>`;
    const floor=Math.max(P.sex==="m"?1500:1200,Math.round(R.bmr*.9)),lowest=Math.min(...DAYS.map(d=>cy.kc[d.k]));
    if(lowest<floor)h+=`<div class="alert"><b>注意：</b>最低一天只有 ${lowest} kcal，低于安全下限 ${floor}，请把低碳日倍数调高。</div>`;
    if(P.age<18||P.preg)h+=`<div class="alert"><b>注意：</b>未成年、怀孕或哺乳期不建议做碳水循环。</div>`;
  }
  return h;
}

function libItems(day,all){
  const home=P.equip==="home",seen=new Set(),items=[];
  const ids=all?Object.keys(EX):DAYLIB[day];
  ids.forEach(id=>{const e=EX[id];if(!e||(home&&e.gymOnly))return;if(P.sex==="f"&&id==="kneelcable")return;const nm=exName(e);if(seen.has(nm))return;seen.add(nm);items.push({id,e,r:all?null:recOf(id,day)})});
  return items;
}
function tplLibHTML(s){
  const items=libItems(s.day,s.all),sel=s.target==="session"?S.ses.ex.map(x=>x.id):getSel(s.day).map(x=>x.id);

  let list=items.filter(x=>(s.grp==="全部"||(s.grp==="★推荐"?x.r:x.e.g===s.grp))&&(!q||(exName(x.e)+x.e.c).toLowerCase().includes(q)));

  list.map(({id,e,r})=>`<div class="lib ${r?"r"+r.lvl:""}"><div class="nm"><b>${esc(exName(e))}${r?`<span class="badge b${r.lvl}">★ ${r.why}</span>`:""}</b><span>${e.g} · ${e.r} · ${esc(SRC[e.s]||"")}</span></div><button class="btn sm ${sel.includes(id)?"mint":""}" data-a="tplToggle" data-id="${id}">${sel.includes(id)?"已加入":"加入"}</button></div>`).join("")||`<div class="empty">没有匹配的动作</div>`;

  const listEx=(ids,label,cnt)=>ids.length?`<div class="sec" style="margin-top:14px">${label}</div>`+ids.map(id=>{const e=EX[id],done=LS.get("done:"+today+":"+id,[]);return `<div class="lib"><div class="nm"><b>${esc(exName(e))}</b><span>${cnt>1?cnt+" 组 × ":""}${e.r}</span></div><div style="display:flex;gap:6px">${Array.from({length:cnt},(_,k)=>`<button class="checkbtn" style="width:38px;height:38px;${done.includes(k)?"background:var(--mint)":""}" data-a="rcheck" data-id="${id}" data-k="${k}">${cnt>1?k+1:"✓"}</button>`).join("")}<button class="iconbtn" style="width:34px;height:34px;box-shadow:none;color:var(--warn)" data-a="rrm" data-id="${id}">×</button></div></div>`}).join(""):"";

  return sheetFrame(`${D.name} ${ses.retro?'<span class="badge">补记</span>':`<span class="num" id="sesclock" style="font-size:15px;color:var(--muted)">${fmtT(sesClock())}</span>`}`,`<div class="hint" style="margin-bottom:8px" id="sesstat">${st.sets} 组 · ${st.vol} t</div>${sesBody()}`,`<button class="btn ghost" data-a="seAddEx" style="white-space:nowrap">＋ 动作</button><button class="btn mint block" data-a="seFinish">结束训练</button>`,{full:true});

A.saveWeigh=()=>{
  const d=$("#wd").value||today,v=parseFloat($("#wv").value),bf=parseFloat($("#wb").value),w=parseFloat($("#ww").value),hr=parseInt($("#wh").value,10);
  if(!(v>=30&&v<=250)&&!(w>=40)){toast("请至少填体重或腰围");return}
  if(v>=30&&v<=250){const old=ws.find(x=>x.d===d)||{};ws=ws.filter(x=>x.d!==d);const rec={d,v};if(bf>=3&&bf<=60)rec.bf=bf;else if(old.bf)rec.bf=old.bf;if(hr>=30&&hr<=150)rec.hr=hr;else if(old.hr)rec.hr=old.hr;ws.push(rec);LS.set("weights",ws)}
  if(w>=40&&w<=200){wa=wa.filter(x=>x.d!==d);wa.push({d,v:w});LS.set("waist",wa)}
  toast("已保存");closeSheet();
};

/* 训练：进行中 */
function saveSes(){LS.set(sesKey(S.ses.date)+(S.ses.sport?":sp":""),S.ses)}
function startClock(){if(!S.timer)S.timer=setInterval(tick,1000)}
function tick(){
  const c=$("#sesclock");if(c&&S.ses&&!S.ses.done)c.textContent=fmtT(sesClock());
  const r=$("#restpill");
  if(S.restEnd){const left=Math.ceil((S.restEnd-Date.now())/1000);
    if(left<=0){S.restEnd=0;if(r)r.remove();try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
    else if(r)r.querySelector(".t").textContent=fmtT(left)}
  else if(r)r.remove();
}
function showRest(){
  let r=$("#restpill");
  if(!r){r=document.createElement("div");r.id="restpill";r.className="rest";r.innerHTML=`休息 <span class="t num"></span><button data-a="restAdd">+15秒</button><button data-a="restSkip">跳过</button>`;document.body.appendChild(r)}
  tick();
}
A.restAdd=()=>{S.restEnd+=15000;tick()};
A.restSkip=()=>{S.restEnd=0;tick()};
function startOrResume(day,date){
  date=date||today;
  const ex=getSes(date);
  if(ex&&ex.done){openSheet({type:"sesview",date,sp:0});return}
  if(ex&&!ex.done&&(day==="free"||ex.day===day))S.ses=ex;
  else{S.ses=newSession(day,date);if(day==="free")S.ses.ex=[];if(date!==today)S.ses.retro=true;saveSes()}
  openSheet({type:"ses"});startClock();
}
A.startSes=a=>startOrResume(a.dataset.v);
function addExToSes(id){
  const ses=S.ses,i=ses.ex.findIndex(e=>e.id===id);
  if(i>=0){ses.ex.splice(i,1)}
  else{const e=EX[id],last=lastSets(id,ses.date),r0=parseReps(e.r),n=setsFor(0,weekOf(today));
    ses.ex.push({id,target:e.r,sets:Array.from({length:n},(_,k)=>{const l=last[k]||last[last.length-1];return {kg:l?l.kg:LS.get("kg:"+id,""),reps:l?l.reps:r0,done:false}})})}
  saveSes();renderSheet();
}
A.seAddEx=()=>openSub({type:"sesadd",day:"push",all:true,target:"session",q:"",grp:"全部"});
A.seCheck=a=>{const z=S.ses.ex[+a.dataset.i].sets[+a.dataset.j];z.done=!z.done;saveSes();if(z.done){S.restEnd=Date.now()+90000;showRest()}renderSheet()};
A.seAdd=a=>{const e=S.ses.ex[+a.dataset.i],l=e.sets[e.sets.length-1]||{kg:"",reps:10};e.sets.push({kg:l.kg,reps:l.reps,done:false});saveSes();renderSheet()};
A.seRm=a=>{S.ses.ex.splice(+a.dataset.i,1);saveSes();renderSheet()};
A.seCue=a=>{const e=S.ses.ex[+a.dataset.i];e.cue=!e.cue;renderSheet()};
function prsOf(ses){
  const prior={};
  sessions().filter(s=>s.done&&s.date!==ses.date).forEach(s=>s.ex.forEach(e=>e.sets.forEach(z=>{if(!z.done)return;const v=e1rm(+z.kg,+z.reps);prior[e.id]=Math.max(prior[e.id]||0,v)})));
  const out=[];
  ses.ex.forEach(e=>{let best=null;e.sets.forEach(z=>{if(!z.done)return;const v=e1rm(+z.kg,+z.reps);if(v>0&&(!best||v>best.e1))best={e1:v,kg:+z.kg,reps:+z.reps}});
    if(best&&(prior[e.id]||0)>0&&best.e1>prior[e.id])out.push(Object.assign({n:exName(EX[e.id])},best))});
  return out;
}
A.seFinish=()=>{
  const ses=S.ses,st=sesStats(ses);
  if(!st.sets){toast("还没有完成的组");return}
  ses.t1=Date.now();ses.done=true;saveSes();
  ses.ex.forEach(e=>{const d=e.sets.filter(z=>z.done&&z.kg!=="");if(d.length)LS.set("kg:"+e.id,d[d.length-1].kg)});
  S.restEnd=0;tick();
  openSub({type:"sum",st:sesStats(ses),prs:prsOf(ses)});
};
A.sumDone=()=>{S.sub=null;closeSheet()};

A.rcheck=a=>{const k="done:"+today+":"+a.dataset.id,j=+a.dataset.k;let d=LS.get(k,[]);d=d.includes(j)?d.filter(x=>x!==j):[...d,j];LS.set(k,d);renderSheet();render()};

/* ---------- 全局事件 ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;
  const fn=A[el.dataset.a];if(fn){fn(el,e)}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="fq"){S.sheet.q=t.value;S.sheet.lim=60;$("#flist").innerHTML=flistHTML(S.sheet)}
  else if(t.id==="sq"){S.sheet.q=t.value;$("#slist").innerHTML=setListHTML(S.sheet)}
  else if(t.id==="sg"){sgInput()}
  else if(t.id==="tq"){const s=S.sub&&S.sub.type==="sesadd"?S.sub:S.sheet;s.q=t.value;$("#tpllib").innerHTML=tplLibHTML(s)}
  else if(t.id==="kq"){S.kq=t.value;$("#kbbody").innerHTML=kbBody()}
  else if(t.dataset.pn){
    const k=t.dataset.pn,v=t.value===""?"":parseFloat(t.value),lim={age:[12,80],h:[120,220],w:[30,250],bf:[4,60]}[k];
    if(v===""){if(k==="bf"){P.bf="";saveP();R=calc();render();const mi=$("#meinfo");if(mi)mi.innerHTML=meInfoHTML()}return}
    if(isNaN(v)||v<lim[0]||v>lim[1])return;
    P[k]=v;saveP();R=calc();render();const mi=$("#meinfo");if(mi)mi.innerHTML=meInfoHTML();
  }
  else if(t.dataset.sk){const [i,j]=t.dataset.sk.split(":").map(Number);S.ses.ex[i].sets[j].kg=t.value;saveSes()}
  else if(t.dataset.sr){const [i,j]=t.dataset.sr.split(":").map(Number);S.ses.ex[i].sets[j].reps=t.value;saveSes()}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.ps){P[t.dataset.ps]=t.value;saveP();R=calc();render();const mi=$("#meinfo");if(mi)mi.innerHTML=meInfoHTML()}
  else if(t.dataset.pc){P[t.dataset.pc]=t.checked;if(t.dataset.pc==="veg"&&P.veg&&FOODS[P.prot]&&FOODS[P.prot].meat)P.prot="tofu";saveP();R=calc();render();renderSheet()}
  else if(t.id==="p-start"){if(t.value){start=t.value;LS.set("start",start);render()}}
  else if(t.id==="rhr"){P.rhr=t.value===""?"":clamp(parseInt(t.value,10)||"",35,110);saveP();renderSheet()}
  else if(t.dataset.cmin!==undefined){const R2=getRest();R2.cardio[+t.dataset.cmin].min=clamp(parseInt(t.value,10)||30,5,180);saveRest(R2)}
  else if(t.id==="cyc-on"){const c=cyc();c.on=t.checked;saveCyc(c);$("#cycbox").innerHTML=cycHTML();render()}
  else if(t.id==="cyc-preset"){const c=cyc();c.preset=t.value;if(PRESETS[c.preset])c.tier={...PRESETS[c.preset].tier};saveCyc(c);$("#cycbox").innerHTML=cycHTML();render()}
  else if(["cyc-H","cyc-M","cyc-L"].includes(t.id)){const v=parseFloat(t.value);if(v>=.5&&v<=10){const c=cyc();c[t.id.slice(4)]=v;saveCyc(c);$("#cycbox").innerHTML=cycHTML();render()}}
  else if(t.dataset.tier){const c=cyc();c.tier[t.dataset.tier]=t.value;c.preset="custom";saveCyc(c);$("#cycbox").innerHTML=cycHTML();render()}
  else if(t.id==="cyc-cal"){const c=cyc();c.cal=t.checked;saveCyc(c);$("#cycbox").innerHTML=cycHTML();render()}
});

S.trainTab="daily";S.weekOff=0;
function vTrainSport(){
  const recent=sessions().filter(s=>s.done&&s.sport).slice(0,5);
  return `<p class="hint" style="margin-bottom:12px">选一项运动，会给出配套的力量、爆发和体能计划，可以直接开始记录。这部分是通用运动科学参考，不是视频内容。</p>
  <div class="sports">${SPORTS.map((s,i)=>`<button class="sport c${i%4}bg" data-a="openSport" data-v="${s.k}"><span class="em">${s.e}</span><b>${s.n}</b><small>${s.tag}</small></button>`).join("")}</div>
  <div class="sec">专项训练记录</div>
  <div class="card hist">${recent.length?recent.map(s=>{const st=sesStats(s),dt=new Date(s.date+"T00:00:00");return `<div class="item" data-a="viewSes" data-v="${s.date}" data-sp="1"><div class="d">${dt.getMonth()+1}/${dt.getDate()}<br>周${WDN[dt.getDay()]}</div><div class="nm"><b>${esc(s.title)}</b><span>${minTxt(st)} · ${st.sets}组</span></div></div>`}).join(""):`<div class="empty">还没有专项训练记录，选一项运动开始吧。</div>`}</div>`;
}
SHEETS.sport=(s)=>{
  const sp=SPORTS.find(x=>x.k===s.k),season=s.season||"off",freq=season==="in"?clamp(s.freq||2,1,2):clamp(s.freq||3,2,4);
  const wk=sportWeek(freq,season),letters=[...new Set(wk.map(x=>x.s))];
  const needs=sp.need.map((v,i)=>`<div class="hbar" style="grid-template-columns:44px 1fr 22px"><span>${SPORT_NEED[i]}</span><div class="tr"><div class="f ${v>=4?"ok":""}" style="width:${v/5*100}%"></div></div><span class="num">${v}</span></div>`).join("");
  const weekRow=`<div class="week">${[1,2,3,4,5,6,0].map(d=>{const it=wk.find(x=>x.d===d);return `<div class="wd ${it?"c"+({A:0,B:1,C:2}[it.s]):"c3"}" style="cursor:default">${WDN[d]}<b>${it?it.s:"休"}</b></div>`}).join("")}</div>`;
  const body=`<div class="card soft"><div style="display:flex;gap:12px;align-items:center"><div style="font-size:44px;line-height:1">${sp.e}</div><div><b style="font-size:17px">${sp.n}</b><div class="hint">${sp.tag}</div></div></div><p style="font-size:14px;margin-top:8px">${esc(sp.why)}</p></div>
  <div class="card"><div class="lab">这项运动的身体素质需求（5 = 最高）</div>${needs}</div>
  <div class="sec" style="margin-top:6px">安排</div>
  <div class="chips"><button class="chip" data-a="spSeason" data-v="off" aria-pressed="${season==="off"}">非赛季（增强期）</button><button class="chip" data-a="spSeason" data-v="in" aria-pressed="${season==="in"}">赛季中</button></div>
  <div class="chips">${(season==="in"?[1,2]:[2,3,4]).map(n=>`<button class="chip" data-a="spFreq" data-v="${n}" aria-pressed="${freq===n}">每周 ${n} 次力量</button>`).join("")}</div>
  <p class="hint" style="margin-bottom:8px">${season==="in"?"赛季中：每节的组数约为六成，专注动作质量，比赛前后留足恢复。":"增强期：力量、爆发和体能为主，容量完整，逐步加重。"}</p>
  ${weekRow}<p class="hint" style="margin-bottom:12px">A、B、C 是下面三节训练，力量日尽量和高强度比赛、技术训练错开，间隔 24–48 小时。</p>
  ${letters.map(L=>`<div class="card"><h3>${L} · ${sp.S[L].n}</h3>${sportItems(sp,L,season).map(it=>{const e=EX[it.id];return `<div class="item" style="min-height:48px"><div class="nm"><b>${esc(exName(e))}</b><span>${it.sets} 组 × ${esc(it.reps)} · ${esc(e.c)}</span></div></div>`}).join("")}<button class="btn mint block" data-a="startSport" data-v="${L}" style="margin-top:10px">开始这节训练</button></div>`).join("")}
  <div class="card"><h3>专项热身</h3><ul class="tight">${sp.warm.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
  <div class="card"><h3>常见伤病与预防</h3><ul class="tight">${sp.inj.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><p class="hint" style="margin-top:6px">${sp.n}的力量训练重点就是补强这些部位。</p></div>
  <div class="card soft"><h3>小贴士</h3><ul class="tight">${sp.tips.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
  <p class="hint">这是通用运动科学参考，不替代技术训练和教练指导。有伤病、慢性病或不确定的动作，请先咨询医生或专业教练，出现疼痛立即停止。</p>`;
  return sheetFrame(sp.e+" "+sp.n+"专项",body,`<button class="btn block mint" data-a="closeSheet">完成</button>`);
};
A.openSport=a=>openSheet({type:"sport",k:a.dataset.v,season:"off",freq:3});
A.spSeason=a=>{S.sheet.season=a.dataset.v;S.sheet.freq=a.dataset.v==="in"?2:3;renderSheet()};
A.spFreq=a=>{S.sheet.freq=+a.dataset.v;renderSheet()};
A.startSport=a=>{
  const sp=SPORTS.find(x=>x.k===S.sheet.k),L=a.dataset.v,season=S.sheet.season||"off",title=sp.n+" · "+L+" "+sp.S[L].n;
  const ex=getSes(today,true);
  if(ex&&!ex.done&&ex.title===title){S.ses=ex}
  else{
    S.ses={day:"sport",sport:sp.k,title,date:today,t0:Date.now(),t1:null,done:false,
      ex:sportItems(sp,L,season).map(it=>({id:it.id,target:it.reps,sets:Array.from({length:it.sets},()=>({kg:"",reps:parseReps(it.reps)||10,done:false}))}))};
    saveSes();
  }
  openSheet({type:"ses"});startClock();
};
A.trainTab=a=>{S.trainTab=a.dataset.v;render()};
A.weekPrev=()=>{S.weekOff=(S.weekOff||0)-1;render()};
A.weekNext=()=>{S.weekOff=(S.weekOff||0)+1;render()};
A.weekNow=()=>{S.weekOff=0;render()};
A.dayView=a=>openSheet({type:"dayview",date:a.dataset.v});
A.dvStart=a=>startOrResume(a.dataset.v,a.dataset.d);
A.dvEdit=a=>openSheet({type:"tpl",day:a.dataset.v,q:"",grp:"全部"});
SHEETS.dayview=(s)=>{
  const d=s.date,idx=dayIndexFor(d),D=DAYS[idx],dt=new Date(d+"T00:00:00"),past=d<today,isToday=d===today;
  const ses=getSes(d),sp=getSes(d,true),done=[ses,sp].filter(x=>x&&x.done),prog=[ses,sp].filter(x=>x&&!x.done);
  const exLog=list=>list.map(e=>`<div class="lib"><div class="nm"><b>${esc(exName(EX[e.id]))}</b><span>${e.sets.filter(z=>z.done).map(z=>(z.kg!==""&&z.kg!=null?z.kg+"×":"")+z.reps).join("　")||"未完成"}</span></div></div>`).join("");
  let body=`<div class="card soft" style="padding:12px 14px"><div class="lab">${isToday?"今天":past?"过去":"未来"}的安排</div><b>${D.name}</b> · ${D.sub}</div>`,foot="";
  done.forEach(x=>{const st=sesStats(x);
    body+=`<div class="card"><h3>${esc(sesName(x))}${x.retro?'<span class="badge">补记</span>':""}</h3><div class="tiles" style="grid-template-columns:repeat(3,1fr);margin-bottom:10px"><div class="tile"><b>${st.min==null?"—":st.min}</b><span>分钟</span></div><div class="tile"><b>${st.sets}</b><span>组</span></div><div class="tile"><b>${st.vol}</b><span>吨</span></div></div>${exLog(x.ex)}<div style="margin-top:8px"><button class="btn sm danger" data-a="delSes" data-v="${x.date}" data-sp="${x.sport?1:0}">删除记录</button></div></div>`});
  prog.forEach(x=>{body+=`<div class="card"><h3>${esc(sesName(x))}</h3><p class="hint">没有完成，已记录的组如下。</p>${exLog(x.ex)}</div>`});
  if(idx<3&&!(ses&&ses.done)){
    const sel=getSel(D.k),wk=weekOf(d);
    body+=`<div class="lab" style="margin:12px 0 4px">${past?"这天没有日常训练记录，原定安排：":isToday?"今天的安排：":"计划要练："}</div>`+sel.map((it,i)=>{const e=EX[it.id];if(!e)return "";return `<div class="lib"><div class="nm"><b>${esc(exName(e))}</b><span>${it.sets||setsFor(i,wk)} 组 × ${esc(it.reps||e.r)}</span></div></div>`}).join("");
    foot+=`<button class="btn ghost" data-a="dvEdit" data-v="${D.k}">改动作</button>`;
    foot+=isToday?`<button class="btn mint block" data-a="dvStart" data-v="${D.k}" data-d="${d}">开始训练</button>`:past?`<button class="btn mint block" data-a="dvStart" data-v="${D.k}" data-d="${d}">补记这天的训练</button>`:`<button class="btn block ghost" data-a="closeSheet">关闭</button>`;
  }
  if(idx===3){
    const cd=LS.get("cdone:"+d,{}),keys=LS.keys().filter(k=>k.startsWith("done:"+d+":")&&!k.includes("cardio_")&&(LS.get(k,[])||[]).length);
    const R2=getRest();
    if(past||isToday){
      const lines=[...Object.entries(cd).map(([id,m])=>CARDIO[id]?CARDIO[id].n+" "+m+"分钟":""),...keys.map(k=>{const id=k.split(":")[2];return EX[id]?exName(EX[id])+" ✓":""})].filter(Boolean);
      body+=`<div class="lab" style="margin:12px 0 4px">${lines.length?"这天完成了：":"这天没有记录。"}</div>${lines.map(l=>`<div class="lib"><div class="nm"><b>${esc(l)}</b></div></div>`).join("")}`;
    }
    if(!past)body+=`<div class="lab" style="margin:12px 0 4px">休息日安排：</div>`+[...R2.cardio.map(c=>CARDIO[c.id].n+" "+c.min+"分钟"),...R2.core.map(i=>EX[i]?exName(EX[i]):""),...R2.mob.map(i=>EX[i]?exName(EX[i]):"")].filter(Boolean).map(l=>`<div class="lib"><div class="nm"><b>${esc(l)}</b></div></div>`).join("");
    foot=isToday?`<button class="btn mint block" data-a="openRest">打开休息日安排</button>`:`<button class="btn block ghost" data-a="closeSheet">关闭</button>`;
  }
  if(!foot)foot=`<button class="btn block ghost" data-a="closeSheet">关闭</button>`;
  return sheetFrame(`${dt.getMonth()+1}月${dt.getDate()}日 周${WDN[dt.getDay()]}`,body,foot);
};

/* ---------- 启动 ---------- */
R=calc();
/* 清理过去没完成的训练：没记任何组的删掉，记了的算作已结束，今天只显示今天的 */
LS.keys().filter(k=>k.startsWith("ses:")).forEach(k=>{const x=LS.get(k,null);if(!x||x.done||x.date>=today)return;const n=(x.ex||[]).reduce((a,e)=>a+e.sets.filter(z=>z.done).length,0);if(!n)LS.del?LS.del(k):localStorage.removeItem("tp."+k);else{x.done=true;x.t1=x.t1||x.t0;LS.set(k,x)}});
render();
if(!LS.get("onboarded",false)&&!LS.get("profile",null))openSheet({type:"settings",open:"me"});
setInterval(tick,5000);

</script>
